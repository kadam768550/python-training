{% extends "base.html" %}

{% block title %}Add Product{% endblock %}

{% block content %}

<style>
    html, body {
        background: #5b2a86 !important;
    }

    .product-card {
        background: #6f35a0 !important;
        border: 2px solid #8e5bc0;
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0,0,0,.3);
    }

    .product-header {
        background: #4b2070 !important;
        color: white;
        padding: 20px;
    }

    .product-header h3 {
        margin: 0;
        font-weight: 700;
    }

    .card-body {
        background: #6f35a0 !important;
        color: white;
    }

    .form-label {
        color: white !important;
        font-weight: 600;
    }

    .form-control {
        background: #7d49aa !important;
        color: white !important;
        border: 2px solid #a77acb;
        border-radius: 10px;
    }

    .form-control::placeholder {
        color: #eee !important;
    }

    .form-control:focus {
        background: #814db0 !important;
        color: white !important;
        border-color: #d0a8ef;
        box-shadow: 0 0 0 3px rgba(255,255,255,.15);
    }

    input[type="file"] {
        color: white !important;
    }

    .add-btn {
        background: linear-gradient(90deg, #4b2070, #8e44ad);
        color: white;
        border: none;
        border-radius: 10px;
        padding: 12px;
        font-weight: 700;
    }

    .add-btn:hover {
        background: #4b2070;
        color: white;
    }
</style>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="product-card">

                <div class="product-header text-center">
                    <h3>➕ Add New Product</h3>
                    <small>Add product details to your inventory</small>
                </div>

                <div class="card-body p-4">

                    <form method="POST"
                          action="{{ url_for('add_product') }}"
                          enctype="multipart/form-data">

                        <div class="mb-3">
                            <label class="form-label">📦 Product Name</label>
                            <input required name="name"
                                   class="form-control"
                                   placeholder="Enter product name"
                                   type="text">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">🏷️ Category</label>
                            <input required name="category"
                                   class="form-control"
                                   placeholder="Enter category"
                                   type="text">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">💰 Price</label>
                            <input required name="price"
                                   class="form-control"
                                   placeholder="₹ Enter price"
                                   type="number">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">📊 Stock</label>
                            <input required name="stock"
                                   class="form-control"
                                   placeholder="Enter stock quantity"
                                   type="number">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">📷 Product Photo</label>
                            <input name="photo"
                                   class="form-control"
                                   type="file"
                                   accept="image/*">
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="add-btn">
                                ➕ Add Product
                            </button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

{% endblock %}
