<!DOCTYPE html>
<html>
    <head>
        <title> Live Search </title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="bg-light">
        <div class="container mt-4"></div>
            <h2 class ="fw-bold mb-4">Product Live Search Demo </h2>

            <!-- Search input -->
            <input type="text"
            id ="searchInput"
            class="form-control mb-3"
            placeholder = "Type to search...">

            <!-- Table -->
            <table class ="table table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>Name</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Stock</th>
                    </tr>
                </thead>

                <tbody id="tableBody">
                    <tr data-name ="bluetooth earphones">
                        <!-- data-name - JS information  -->
                        <td>Bluetooth Earphones</td>
                        <td>Audio</td>
                        <td>1499</td>
                        <td>30</td>
                    </tr>
                    <tr data-name ="gaming mouse">
                        <!-- data-name - JS information  -->
                        <td>Gaming Mouse</td>
                        <td>Accessories</td>
                        <td>1999</td>
                        <td>20</td>
                    </tr>
                    <tr data-name ="laptop cooling pad">
                        <!-- data-name - JS information  -->
                        <td>Laptop Cooling Pad</td>
                        <td>Accessories</td>
                        <td>1299</td>
                        <td>15</td>
                    </tr>
                    <tr data-name ="cctv security camera">
                        <!-- data-name - JS information  -->
                        <td>CCTV Security Camera</td>
                        <td>Security</td>
                        <td>3999</td>
                        <td>12</td>
                    </tr>
                    <tr data-name ="memory card 64gb">
                        <!-- data-name - JS information  -->
                        <td>Memory Card 64GB</td>
                        <td>Storage</td>
                        <td>799</td>
                        <td>40</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <script>
            const searchInput = document.getElementById('searchInput');
            const allRows = document.querySelectorAll('#tableBody tr');
            
            searchInput.addEventListener('keyup', function() {
                const query = this.value.toLowerCase();
                allRows.forEach(function(row) {
                    const name = row.dataset.name;

                    if(name.includes(query)){
                        row.style.display = '';
                    } else {
                        row.style.display = 'none';
                    }
                });
            });      
        </script>
    </body>
</html>
