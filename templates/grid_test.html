<!DOCTYPE html>
<html>
    <head>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <style>
            .box {
                background: #1e3a5f;
                color: white;
                padding: 20px;
                margin-bottom: 10px;
                border-radius: 8px;
            }
        </style>
    </head>
    <body class="p-4">

        <h2> Grid Demo  </h2>
    <!-- STEP 1 -Full width -->
        <div class = "row mb-3">
            <div class="col-md-12">
                <div class="box">Full Width</div>
            </div>
        </div>

        <!- - STEP 2 - Two columns -- >
        <div class = "row mb-3">
            <div class="col-md-6">
                <div class="box">Column 1</div>
            </div>
            <div class="col-md-6">
                <div class="box">Column 2</div>
            </div>
        </div>

        <!- - STEP 3 - Three columns -- >
        <div class = "row mb-3">
            <div class="col-md-4">
                <div class="box">Column 1</div>
            </div>
            <div class="col-md-4">
                <div class="box">Column 2</div>
            </div>
            <div class="col-md-4">
                <div class="box">Column 3</div>
            </div>
        </div> 

        <!- - STEP 4 - Uneven Split -- ->
        <div class = "row mb-3">
            <div class="col-md-3">
                <div class="box">25%</div>
            </div>
            <div class="col-md-6">
                <div class="box">50%</div>
            </div>
            <div class="col-md-3">
                <div class="box">25%</div>
            </div>
        </div>

    </body>
</html>
