{% extends 'base.html' %}
{% block title %}Login{% endblock %}

{% block content %}

<style>
body{background:#5b2a86!important}

.login-page{
 max-width:1000px;margin:45px auto;display:flex;
 background:#6f35a0;border-radius:18px;overflow:hidden;
 box-shadow:0 10px 30px #32104d
}

.login-left{
 width:50%;padding:45px 30px;text-align:center;color:white;
 display:flex;flex-direction:column;justify-content:center
}

.login-left .user-icon{
 width:150px;height:150px;border-radius:50%;
 background:white;margin:0 auto 25px;
 display:flex;align-items:center;justify-content:center;
 font-size:80px
}

.login-left h1{font-weight:bold;font-size:38px}
.login-left p{font-size:17px;line-height:1.6}
.store-icons{font-size:38px;margin-top:20px;word-spacing:18px}

.login-box{
 width:50%;background:#fff;padding:35px
}

.login-icon{text-align:center;font-size:45px}
.login-box h4{color:#5b2a86}
.login-box label{color:#333;font-weight:bold}

.form-control{
 border:2px solid #c5a8dc!important;border-radius:10px;
 padding:11px
}

.password-box{position:relative}
.password-box .form-control{padding-right:50px}

.password-eye{
 position:absolute;right:15px;top:9px;
 cursor:pointer;font-size:22px
}

.btn-login{
 width:100%;padding:11px;border:0;border-radius:10px;
 background:linear-gradient(90deg,#4b2070,#8e44ad);
 color:white;font-weight:bold
}

.login-box a{color:#6f35a0;font-weight:bold}

@media(max-width:768px){
 .login-page{margin:20px 12px;display:block}
 .login-left,.login-box{width:100%}
 .login-left{padding:30px 20px}
 .login-left .user-icon{width:110px;height:110px;font-size:60px}
 .login-left h1{font-size:30px}
}
</style>

<div class="login-page">

    <!-- LEFT SIDE -->
    <div class="login-left">

        <div class="user-icon">👨‍💼</div>

        <h1>🛒 SmartTech<br>Store</h1>

        <p>
            Your Smart Solution For Easy
            Product & Inventory Management.
        </p>

        <div class="store-icons">
            🛒 📦 💻
        </div>

    </div>

    <!-- LOGIN SIDE -->
    <div class="login-box">

        <div class="login-icon">🔐</div>

        <h4 class="fw-bold text-center mb-4">
            Login
        </h4>

        <form method="POST" action="{{url_for('login')}}">

            <label>👤 Username</label>
            <input type="text"
                   name="username"
                   class="form-control mb-3"
                   placeholder="Enter username"
                   required>

            <label>🔑 Password</label>

            <div class="password-box">
                <input type="password"
                       id="loginPassword"
                       name="password"
                       class="form-control mb-4"
                       placeholder="Enter password"
                       required>

                <span class="password-eye"
                      onclick="togglePassword('loginPassword',this)">
                    👁️
                </span>
            </div>

            <button type="submit" class="btn-login">
                🔓 Login
            </button>

        </form>

        <p class="text-center mt-3 mb-0">
            No account?
            <a href="{{url_for('register')}}">
                📝 Register here
            </a>
        </p>

    </div>

</div>

<script>
function togglePassword(id,eye){
    let input=document.getElementById(id);

    if(input.type==="password"){
        input.type="text";
        eye.innerHTML="🙈";
    }else{
        input.type="password";
        eye.innerHTML="👁️";
    }
}
</script>

{% endblock %}
