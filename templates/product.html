{% extends "base.html" %}

{% block title %}
Products
{% endblock %}

{% block content %}

<h2 class="mb-4 text-primary">
Product List
</h2>

<table class="table table-bordered table-hover shadow">

<thead class="table-dark">

<tr>

<th>ID</th>

<th>Name</th>

<th>Category</th>

<th>Price</th>

<th>Stock</th>

</tr>

</thead>

<tbody>

{% for product in products %}

<tr>

<td>{{ product.id }}</td>

<td>{{ product.name }}</td>

<td>{{ product.category }}</td>

<td>₹{{ product.price }}</td>

<td>{{ product.stock }}</td>

</tr>

{% endfor %}

</tbody>

</table>
{% endblock %}
