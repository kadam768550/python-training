{% extends 'base.html' %}
{% block title %}Products - Shop Inventory System {% endblock %}

{% block content %}
<h1>Products</h1>
<p>products: {{ products|length }}</p>

<table border="1">
    <tr>
        <th>Name</th>
        <th>Price</th>
        <th>Stock</th>
    </tr>
    {% for product in products %}
    <tr>
        <td>{{ product.name }}</td>
        <td>{{ product.price }}</td>
        <td>{{ product.stock }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
